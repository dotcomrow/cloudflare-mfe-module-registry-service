name: Terraform Deploy Auto Retry

on:
  workflow_run:
    workflows:
      - Terraform Deploy
    branches:
      - dev
      - prod
    types:
      - completed
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  retry-until-success:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch:
          - dev
          - prod
    concurrency:
      group: terraform-deploy-auto-retry-${{ matrix.branch }}
      cancel-in-progress: false

    steps:
      - name: Retry failed Terraform deploys until successful
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_BOT_TOKEN || github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ matrix.branch }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET_WORKFLOW_NAME: "Terraform Deploy"
          TARGET_WORKFLOW_FILE: "terraform-deploy.yml"
          MAX_RETRY_ATTEMPTS: ${{ vars.TERRAFORM_AUTO_RETRY_MAX_ATTEMPTS || 10 }}
        run: |
          set -euo pipefail

          sanitize_positive_int() {
            local raw="$1"
            local default_value="$2"
            if [[ "${raw}" =~ ^[1-9][0-9]*$ ]]; then
              printf '%s' "${raw}"
              return 0
            fi
            printf '%s' "${default_value}"
          }

          MAX_RETRY_ATTEMPTS="$(sanitize_positive_int "${MAX_RETRY_ATTEMPTS:-10}" "10")"
          echo "Configured max retry attempts: ${MAX_RETRY_ATTEMPTS}"

          should_monitor_branch() {
            if [ "${EVENT_NAME}" != "workflow_run" ]; then
              return 0
            fi

            if [ "${WORKFLOW_RUN_BRANCH}" != "${BRANCH}" ]; then
              echo "workflow_run was for '${WORKFLOW_RUN_BRANCH}', this job is '${BRANCH}'. Skipping."
              return 1
            fi

            if [ "${WORKFLOW_RUN_CONCLUSION}" != "failure" ]; then
              echo "workflow_run conclusion for '${BRANCH}' was '${WORKFLOW_RUN_CONCLUSION}'. Nothing to retry."
              return 1
            fi

            return 0
          }

          latest_run_json() {
            gh run list -R "${OWNER}/${REPO}" \
              --workflow "${TARGET_WORKFLOW_NAME}" \
              --branch "${BRANCH}" \
              --limit 1 \
              --json databaseId,status,conclusion,createdAt,url,event,headSha || echo "[]"
          }

          recent_runs_json() {
            gh run list -R "${OWNER}/${REPO}" \
              --workflow "${TARGET_WORKFLOW_NAME}" \
              --branch "${BRANCH}" \
              --limit 100 \
              --json databaseId,status,conclusion,createdAt,url,event,headSha || echo "[]"
          }

          run_status_json() {
            local run_id="$1"
            gh run view -R "${OWNER}/${REPO}" "${run_id}" --json databaseId,status,conclusion,createdAt,url,headBranch,headSha || echo "{}"
          }

          dispatch_branch() {
            echo "Dispatching ${TARGET_WORKFLOW_NAME} on branch '${BRANCH}'."
            gh api --method POST "/repos/${OWNER}/${REPO}/actions/workflows/${TARGET_WORKFLOW_FILE}/dispatches" -f ref="${BRANCH}" >/dev/null
          }

          is_retryable_conclusion() {
            case "$1" in
              failure|cancelled|timed_out|startup_failure)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          retryable_failure_count_for_sha() {
            local head_sha="$1"
            if [ -z "${head_sha}" ] || [ "${head_sha}" = "null" ]; then
              printf '0'
              return 0
            fi

            recent_runs_json | jq --arg head_sha "${head_sha}" \
              '[.[] | select(
                .headSha == $head_sha
                and .status == "completed"
                and (
                  .conclusion == "failure"
                  or .conclusion == "cancelled"
                  or .conclusion == "timed_out"
                  or .conclusion == "startup_failure"
                )
              )] | length'
          }

          dispatch_branch_with_limit() {
            local source_run_id="${1:-}"
            local source_head_sha="${2:-}"
            local retryable_failure_count="0"

            if [ -n "${source_head_sha}" ] && [ "${source_head_sha}" != "null" ]; then
              retryable_failure_count="$(retryable_failure_count_for_sha "${source_head_sha}")"
              if [ "${retryable_failure_count}" -gt "${MAX_RETRY_ATTEMPTS}" ]; then
                local failed_retries=$((retryable_failure_count - 1))
                echo "Observed ${retryable_failure_count} retryable failed ${TARGET_WORKFLOW_NAME} runs for ${source_head_sha} on '${BRANCH}'."
                echo "At least ${failed_retries} retry attempts have already failed; stopping retries."
                return 1
              fi
            fi

            retry_attempt=$((retry_attempt + 1))
            if [ "${retry_attempt}" -gt "${MAX_RETRY_ATTEMPTS}" ]; then
              echo "Reached retry attempt limit (${MAX_RETRY_ATTEMPTS}) for branch '${BRANCH}'. Stopping retries."
              return 1
            fi

            if [ -n "${source_run_id}" ]; then
              echo "Dispatching retry attempt ${retry_attempt}/${MAX_RETRY_ATTEMPTS} after run ${source_run_id} on '${BRANCH}'."
            else
              echo "Dispatching retry attempt ${retry_attempt}/${MAX_RETRY_ATTEMPTS} on '${BRANCH}'."
            fi
            dispatch_branch
          }

          wait_for_new_run_id() {
            local previous_run_id="$1"
            local wait_count=0
            NEW_RUN_ID=""

            while true; do
              sleep 15

              local latest_json
              latest_json="$(latest_run_json)"
              if [ -n "${latest_json}" ] && [ "$(echo "${latest_json}" | jq 'length')" -gt 0 ]; then
                local latest_run_id
                latest_run_id="$(echo "${latest_json}" | jq -r '.[0].databaseId')"

                if [ -n "${latest_run_id}" ] && [ "${latest_run_id}" != "null" ] && [ "${latest_run_id}" != "${previous_run_id}" ]; then
                  echo "Detected new ${TARGET_WORKFLOW_NAME} run ${latest_run_id} on '${BRANCH}'."
                  NEW_RUN_ID="${latest_run_id}"
                  return 0
                fi
              fi

              wait_count=$((wait_count + 1))
              if [ "${wait_count}" -ge 40 ]; then
                echo "Dispatched run not visible yet on '${BRANCH}'. Re-dispatching."
                if ! dispatch_branch_with_limit "${previous_run_id}" "${ACTIVE_HEAD_SHA:-}"; then
                  return 1
                fi
                wait_count=0
              fi
            done
          }

          monitor_branch_until_success() {
            local active_run_id="${WORKFLOW_RUN_ID:-}"
            ACTIVE_HEAD_SHA="${WORKFLOW_RUN_SHA:-}"
            local run_json
            local latest_status
            local run_conclusion
            local retry_attempt=0

            local bootstrap_json
            bootstrap_json="$(latest_run_json)"
            if [ -n "${bootstrap_json}" ] && [ "$(echo "${bootstrap_json}" | jq 'length')" -gt 0 ]; then
              local latest_run_id
              latest_run_id="$(echo "${bootstrap_json}" | jq -r '.[0].databaseId')"
              if [ -z "${active_run_id}" ] || [ "${active_run_id}" != "${latest_run_id}" ]; then
                if [ -n "${active_run_id}" ]; then
                  echo "Run ${active_run_id} is no longer the latest ${TARGET_WORKFLOW_NAME} run on '${BRANCH}'; monitoring latest run ${latest_run_id}."
                fi
                active_run_id="${latest_run_id}"
                ACTIVE_HEAD_SHA="$(echo "${bootstrap_json}" | jq -r '.[0].headSha // ""')"
              fi
            elif [ -z "${active_run_id}" ]; then
              echo "No ${TARGET_WORKFLOW_NAME} runs found for '${BRANCH}'. Nothing to retry."
              return 0
            fi

            while true; do
              run_json="$(run_status_json "${active_run_id}")"
              if [ -z "${run_json}" ] || [ "${run_json}" = "{}" ]; then
                echo "Run ${active_run_id} no longer available. Falling back to latest for '${BRANCH}'."
                bootstrap_json="$(latest_run_json)"
                if [ -z "${bootstrap_json}" ] || [ "$(echo "${bootstrap_json}" | jq 'length')" -eq 0 ]; then
                  echo "No ${TARGET_WORKFLOW_NAME} runs found for '${BRANCH}'. Nothing to retry."
                  return 0
                fi
                active_run_id="$(echo "${bootstrap_json}" | jq -r '.[0].databaseId')"
                ACTIVE_HEAD_SHA="$(echo "${bootstrap_json}" | jq -r '.[0].headSha // ""')"
                continue
              fi

              latest_status="$(echo "${run_json}" | jq -r '.status')"
              run_conclusion="$(echo "${run_json}" | jq -r '.conclusion // ""')"
              ACTIVE_HEAD_SHA="$(echo "${run_json}" | jq -r '.headSha // ""')"

              echo "Branch '${BRANCH}' active run=${active_run_id} status=${latest_status} conclusion=${run_conclusion}"

              if [ "${latest_status}" = "in_progress" ] || [ "${latest_status}" = "queued" ]; then
                sleep 20
                continue
              fi

              if [ "${run_conclusion}" = "success" ]; then
                echo "Run ${active_run_id} succeeded. Retry loop complete."
                return 0
              fi

              if is_retryable_conclusion "${run_conclusion}"; then
                if ! dispatch_branch_with_limit "${active_run_id}" "${ACTIVE_HEAD_SHA}"; then
                  return 1
                fi

                if ! wait_for_new_run_id "${active_run_id}"; then
                  return 1
                fi

                active_run_id="${NEW_RUN_ID}"
                continue
              fi

              echo "Branch '${BRANCH}' has non-retryable conclusion '${run_conclusion}'. Nothing to retry."
              return 0
            done
          }

          if ! should_monitor_branch; then
            exit 0
          fi

          echo "Starting retry monitor for branch '${BRANCH}' (event=${EVENT_NAME})."
          monitor_branch_until_success
