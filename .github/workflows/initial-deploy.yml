name: Initial create workflow

on:
  push:

permissions: write-all

jobs:
  deploy:
    env:
      TF_CLOUD_ORGANIZATION: ${{ github.repository_owner }}
      TF_API_TOKEN: ${{ secrets.TFE_TOKEN }}
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Wrangler config
        run: npm run cf:resolve-config

      - name: Bundle worker entrypoint with Wrangler
        run: |
          rm -rf terraform/worker-build
          mkdir -p terraform/worker-build
          WRANGLER_LOG=error npx wrangler deploy --dry-run --outdir terraform/worker-build --config wrangler.resolved.jsonc --env production

      - name: Lookup Project ID
        id: lookup_project_id
        run: |
          curl \
            --header "Authorization: Bearer ${{ secrets.TFE_TOKEN }}" \
            --header "Content-Type: application/vnd.api+json" \
            --request GET \
            --output project_output.txt \
            https://app.terraform.io/api/v2/organizations/${{ github.repository_owner }}/projects
          echo "project_id=$(jq -r --arg name '${{ vars.TFE_PROJECT }}' '.data[] | select(.attributes.name | test($name; "i")) | .id' project_output.txt)" >> "$GITHUB_OUTPUT"

      - name: Create workspaces
        id: create_workspaces
        run: |
          PROJECT_ID="${{ steps.lookup_project_id.outputs.project_id }}"
          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "null" ]; then
            echo "Unable to resolve Terraform Cloud project id for '${{ vars.TFE_PROJECT }}'."
            exit 1
          fi

          create_or_get_workspace() {
            local workspace_name="$1"
            local output_key="$2"

            LOOKUP_STATUS=$(curl -sS -o workspace-lookup.json -w "%{http_code}" \
              --header "Authorization: Bearer ${{ secrets.TFE_TOKEN }}" \
              --header "Content-Type: application/vnd.api+json" \
              "https://app.terraform.io/api/v2/organizations/${{ github.repository_owner }}/workspaces/${workspace_name}")

            if [ "$LOOKUP_STATUS" = "200" ]; then
              WORKSPACE_ID=$(jq -r '.data.id' workspace-lookup.json)
              echo "Workspace '${workspace_name}' already exists (${WORKSPACE_ID})."
              echo "${output_key}=${WORKSPACE_ID}" >> "$GITHUB_OUTPUT"
              return
            fi

            if [ "$LOOKUP_STATUS" != "404" ]; then
              echo "Failed to lookup workspace '${workspace_name}' (HTTP ${LOOKUP_STATUS})."
              cat workspace-lookup.json || true
              exit 1
            fi

            jq -n \
              --arg workspace_name "$workspace_name" \
              --arg project_id "$PROJECT_ID" \
              '{
                data: {
                  attributes: {
                    name: $workspace_name,
                    "execution-mode": "remote",
                    "auto-apply": true
                  },
                  type: "workspaces",
                  relationships: {
                    project: {
                      data: {
                        type: "projects",
                        id: $project_id
                      }
                    }
                  }
                }
              }' > payload.json

            CREATE_STATUS=$(curl -sS -o workspace-create.json -w "%{http_code}" \
              --header "Authorization: Bearer ${{ secrets.TFE_TOKEN }}" \
              --header "Content-Type: application/vnd.api+json" \
              --request POST \
              --data @payload.json \
              "https://app.terraform.io/api/v2/organizations/${{ github.repository_owner }}/workspaces")

            if [ "$CREATE_STATUS" != "201" ]; then
              echo "Failed to create workspace '${workspace_name}' (HTTP ${CREATE_STATUS})."
              cat workspace-create.json || true
              exit 1
            fi

            WORKSPACE_ID=$(jq -r '.data.id' workspace-create.json)
            echo "Workspace '${workspace_name}' created (${WORKSPACE_ID})."
            echo "${output_key}=${WORKSPACE_ID}" >> "$GITHUB_OUTPUT"
          }

          create_or_get_workspace "${{ github.event.repository.name }}" "workspace_id_production"
          create_or_get_workspace "${{ github.event.repository.name }}-preview" "workspace_id_preview"

      - name: Create workspace variables
        run: |
          create_var() {
            local workspace_id="$1"
            local key="$2"
            local value="$3"
            local description="$4"

            jq -n \
              --arg key "$key" \
              --arg value "$value" \
              --arg description "$description" \
              --arg workspace_id "$workspace_id" \
              '{
                data: {
                  type: "vars",
                  attributes: {
                    key: $key,
                    value: $value,
                    description: $description,
                    category: "terraform",
                    hcl: false,
                    sensitive: false
                  },
                  relationships: {
                    workspace: {
                      data: {
                        id: $workspace_id,
                        type: "workspaces"
                      }
                    }
                  }
                }
              }' > payload.json

            curl \
              --header "Authorization: Bearer ${{ secrets.TFE_TOKEN }}" \
              --header "Content-Type: application/vnd.api+json" \
              --request POST \
              --data @payload.json \
              https://app.terraform.io/api/v2/vars
          }

          create_vars_for_workspace() {
            local workspace_id="$1"
            create_var "$workspace_id" "project_name" "${{ github.event.repository.name }}" "project name"
            create_var "$workspace_id" "org_name" "${{ github.repository_owner }}" "organization name"
          }

          create_vars_for_workspace "${{ steps.create_workspaces.outputs.workspace_id_production }}"
          create_vars_for_workspace "${{ steps.create_workspaces.outputs.workspace_id_preview }}"

      - uses: hashicorp/tfc-workflows-github/actions/upload-configuration@8e08d1ba957673f5fbf971a22b3219639dc45661
        id: upload
        with:
          workspace: ${{ github.event.repository.name }}
          directory: terraform

      - name: Create Apply Run
        uses: hashicorp/tfc-workflows-github/actions/create-run@8e08d1ba957673f5fbf971a22b3219639dc45661
        id: apply-run
        if: success() || failure()
        with:
          workspace: ${{ github.event.repository.name }}
          configuration_version: ${{ steps.upload.outputs.configuration_version_id }}
          plan_only: false

      - name: Disable initial workflow
        run: |
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository_owner }}/${{ github.event.repository.name }}/actions/workflows/initial-deploy.yml/disable
        env:
          GH_TOKEN: ${{ github.token }}
